<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img" aria-labelledby="title desc">
<title id="title">On-call assistant: find information and help engineers respond</title><desc id="desc">The assistant finds incident information and responds. An engineer can take control to review suggested replies, then hand control back. Inactivity can also return control to the assistant.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="none" stroke="#315c45" stroke-width="1.2" /></marker></defs>
<style>text{font-family:"Avenir Next",Avenir,sans-serif;fill:#22332b} .label{font-size:20px;font-weight:500}.sub{font-size:15px;fill:#5e6a62}.eyebrow{font-size:13px;letter-spacing:1px;fill:#315c45}.arrow{fill:none;stroke:#315c45;stroke-width:1.5;marker-end:url(#arrow)}</style>
<rect width="640" height="390" fill="#edf1e7" />
<text x="20" y="27" class="eyebrow" text-anchor="start">FIND INFORMATION ABOUT THE INCIDENT</text>
<rect x="20" y="48" width="600" height="76" rx="3" fill="#fdfcf8" stroke="#bccbb4" />
<text x="320.0" y="79" class="label" text-anchor="middle">Find relevant information</text>
<text x="320.0" y="104" class="sub" text-anchor="middle">Past solutions · company docs · monitoring links · images</text>
<path class="arrow" d="M108 125V181" />
<text x="129" y="158" class="sub" text-anchor="start">Information</text>
<rect x="20" y="183" width="176" height="76" rx="3" fill="#fdfcf8" stroke="#bccbb4" />
<text x="108.0" y="214" class="label" text-anchor="middle">AI responds</text>
<text x="108.0" y="239" class="sub" text-anchor="middle">Before takeover</text>
<rect x="232" y="183" width="176" height="76" rx="3" fill="#e4ebdc" stroke="#bccbb4" />
<text x="320.0" y="214" class="label" text-anchor="middle">Take control</text>
<text x="320.0" y="239" class="sub" text-anchor="middle">Engineer takes over</text>
<rect x="444" y="183" width="176" height="76" rx="3" fill="#fdfcf8" stroke="#bccbb4" />
<text x="532.0" y="214" class="label" text-anchor="middle">Review &amp; send</text>
<text x="532.0" y="239" class="sub" text-anchor="middle">Edit / discard / send</text>
<path class="arrow" d="M197 221H229" stroke-dasharray="5 5" />
<path class="arrow" d="M409 221H441" />
<path class="arrow" d="M320 260V308H108V262" stroke-dasharray="5 5" />
<text x="216" y="332" class="sub" text-anchor="middle">Release control / inactivity</text>
<path d="M20 363H57" stroke="#315c45" stroke-width="1.5" />
<text x="66" y="369" class="sub" text-anchor="start">Information flow</text>
<path d="M292 363H329" stroke="#315c45" stroke-width="1.5" stroke-dasharray="5 5" />
<text x="338" y="369" class="sub" text-anchor="start">Who is responding</text>
</svg>