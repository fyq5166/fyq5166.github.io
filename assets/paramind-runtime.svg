<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img" aria-labelledby="title desc">
<title id="title">ParaMind: demonstrated runtime and separate desktop prototype</title><desc id="desc">Two nodes exchange intermediate hidden states in a sequential inference path. The desktop prototype is a separate output, not connected to this P2P runtime. Simplified architecture, not an exact layer allocation.</desc>
