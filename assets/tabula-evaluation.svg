<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img" aria-labelledby="title desc">
<title id="title">TABULA-R²: testing AI answers to table questions</title><desc id="desc">Prepare questions and reference answers, then test models using table-operation tools. A language model compares the final answer with its reference.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="none" stroke="#315c45" stroke-width="1.2" /></marker></defs>
<style>text{font-family:"Avenir Next",Avenir,sans-serif;fill:#22332b} .label{font-size:20px;font-weight:500}.sub{font-size:15px;fill:#5e6a62}.eyebrow{font-size:13px;letter-spacing:1px;fill:#315c45}.arrow{fill:none;stroke:#315c45;stroke-width:1.5;marker-end:url(#arrow)}</style>
<rect width="640" height="390" fill="#edf1e7" />
<text x="20" y="28" class="eyebrow" text-anchor="start">1 / PREPARE THE QUESTIONS</text>
<rect x="20" y="52" width="176" height="76" rx="3" fill="#fdfcf8" stroke="#bccbb4" />
<text x="108.0" y="83" class="label" text-anchor="middle">129 data tables</text>
<text x="108.0" y="108" class="sub" text-anchor="middle">Our World in Data</text>
<rect x="232" y="52" width="176" height="76" rx="3" fill="#fdfcf8" stroke="#bccbb4" />
<text x="320.0" y="83" class="label" text-anchor="middle">Write questions</text>
<text x="320.0" y="108" class="sub" text-anchor="middle">With AI assistance</text>
<rect x="444" y="52" width="176" height="76" rx="3" fill="#fdfcf8" stroke="#bccbb4" />
<text x="532.0" y="83" class="label" text-anchor="middle">Check references</text>
<text x="532.0" y="108" class="sub" text-anchor="middle">Queries / review / AI</text>
<path class="arrow" d="M197 90H229" />
<path class="arrow" d="M409 90H441" />
<path d="M20 160H620" stroke="#bccbb4" />
<text x="20" y="189" class="eyebrow" text-anchor="start">2 / TEST THE MODEL</text>
<rect x="20" y="215" width="176" height="76" rx="3" fill="#fdfcf8" stroke="#bccbb4" />
<text x="108.0" y="246" class="label" text-anchor="middle">Choose a step</text>
<text x="108.0" y="271" class="sub" text-anchor="middle">Request an action</text>
<rect x="232" y="215" width="176" height="76" rx="3" fill="#fdfcf8" stroke="#bccbb4" />
<text x="320.0" y="246" class="label" text-anchor="middle">Run the action</text>
<text x="320.0" y="271" class="sub" text-anchor="middle">Process table data</text>
<rect x="444" y="215" width="176" height="76" rx="3" fill="#fdfcf8" stroke="#bccbb4" />
<text x="532.0" y="246" class="label" text-anchor="middle">Score the answer</text>
<text x="532.0" y="271" class="sub" text-anchor="middle">AI compares answers</text>
<path class="arrow" d="M197 253H229" />
<path class="arrow" d="M409 253H441" />
