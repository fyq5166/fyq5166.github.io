<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img" aria-labelledby="title desc">
<title id="title">WorldMap: map websites and generate browser tasks</title><desc id="desc">Explore page controls to build a reusable website map. Use small parts of it to generate step-by-step tasks, explain the actions, and review the examples.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="none" stroke="#315c45" stroke-width="1.2" /></marker></defs>
<style>text{font-family:"Avenir Next",Avenir,sans-serif;fill:#22332b} .label{font-size:20px;font-weight:500}.sub{font-size:15px;fill:#5e6a62}.eyebrow{font-size:13px;letter-spacing:1px;fill:#315c45}.arrow{fill:none;stroke:#315c45;stroke-width:1.5;marker-end:url(#arrow)}</style>
<rect width="640" height="390" fill="#edf1e7" />
<text x="20" y="27" class="eyebrow" text-anchor="start">MAP THE TEST WEBSITE</text>
<rect x="20" y="52" width="176" height="76" rx="3" fill="#fdfcf8" stroke="#bccbb4" />
<text x="108.0" y="83" class="label" text-anchor="middle">Page controls</text>
<text x="108.0" y="108" class="sub" text-anchor="middle">Buttons, links, and inputs</text>
<rect x="232" y="52" width="176" height="76" rx="3" fill="#fdfcf8" stroke="#bccbb4" />
<text x="320.0" y="83" class="label" text-anchor="middle">Try interactions</text>
<text x="320.0" y="108" class="sub" text-anchor="middle">Clean up page elements</text>
<rect x="444" y="52" width="176" height="76" rx="3" fill="#e4ebdc" stroke="#bccbb4" />
<text x="532.0" y="83" class="label" text-anchor="middle">Website map</text>
<text x="532.0" y="108" class="sub" text-anchor="middle">Actions and their effects</text>
<path class="arrow" d="M197 90H229" />
<path class="arrow" d="M409 90H441" />
<path class="arrow" d="M532 129V176H108V213" />
<text x="302" y="166" class="sub" text-anchor="middle">Reuse the map to create more tasks</text>
<rect x="20" y="215" width="176" height="76" rx="3" fill="#fdfcf8" stroke="#bccbb4" />
<text x="108.0" y="246" class="label" text-anchor="middle">Read part of map</text>
<text x="108.0" y="271" class="sub" text-anchor="middle">A few steps at a time</text>
<rect x="232" y="215" width="176" height="76" rx="3" fill="#fdfcf8" stroke="#bccbb4" />
<text x="320.0" y="246" class="label" text-anchor="middle">Generate steps</text>
<text x="320.0" y="271" class="sub" text-anchor="middle">Actions and explanations</text>
<rect x="444" y="215" width="176" height="76" rx="3" fill="#fdfcf8" stroke="#bccbb4" />
<text x="532.0" y="246" class="label" text-anchor="middle">Review examples</text>
<text x="532.0" y="271" class="sub" text-anchor="middle">Remove repeated tasks</text>
<path class="arrow" d="M197 253H229" />
<path class="arrow" d="M409 253H441" />
<path class="arrow" d="M318 292V331H108V295" />
<text x="213" y="353" class="sub" text-anchor="middle">Continue from the last step</text>
<text x="20" y="381" class="sub" text-anchor="start">Effect on AI training was not measured.</text>
